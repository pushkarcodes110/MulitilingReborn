plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.multilingreborn.keyboard'
    compileSdk 35          // Android 15; update to 36 when SDK 36 drops for Android 16

    defaultConfig {
        applicationId "com.multilingreborn.keyboard"
        minSdk 24             // Android 7.0+
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
        }
    }

    // Size optimisation: strip unused locales from support libs
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

dependencies {
    // Only appcompat – ~200KB after shrinking
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Core-ktx for WindowInsetsController (Android 16 edge-to-edge compat)
    implementation 'androidx.core:core-ktx:1.13.1'
}
